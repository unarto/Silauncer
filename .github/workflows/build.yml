name: Build and Validate APKs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (optional)
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate and build debug APK
        run: gradle testDebugUnitTest lintDebug assembleDebug

      - name: Build release APK
        run: >-
          KEYSTORE_PATH=${{ github.workspace }}/debug.keystore
          STORE_PASSWORD=android
          KEY_PASSWORD=android
          KEY_ALIAS=androiddebugkey
          gradle assembleRelease

      - name: Generate checksums
        run: |
          mkdir -p apks_output
          cp app/build/outputs/apk/debug/app-debug.apk apks_output/silauncer-debug.apk
          cp app/build/outputs/apk/release/app-release.apk apks_output/silauncer-release.apk
          (cd apks_output && sha256sum *.apk > checksums.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: silauncer-apks
          path: apks_output/
          retention-days: 7

      - name: Create GitHub Release
        if: github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: apks_output/*
